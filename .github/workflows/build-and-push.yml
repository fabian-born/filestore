name: Build and push images

# Builds the backend and frontend images and pushes them to GHCR under the
# project's date-based version scheme (see docker-build.sh), then commits
# the bumped VERSION file back to the repo. This is the automated
# equivalent of running ./docker-build.sh locally.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The webtools-backend/webtools-frontend packages predate this repo
      # (pushed manually via docker-build.sh) and aren't linked to it, so the
      # default GITHUB_TOKEN can't write to them - a PAT that authenticates
      # as the account that owns the packages is needed instead.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: fabian-born
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        run: ./docker-build.sh

      - name: Commit bumped VERSION file
        run: |
          if git diff --quiet VERSION; then
            echo "VERSION unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $(cat VERSION) [skip ci]"
          git push
