server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    location /api/ {
        proxy_pass http://webtools-fileexplorer-backend:3452/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Vite names these with a content hash, so a changed file always gets a
    # new URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references the hashed asset filenames, so it must never be
    # served stale — always revalidate with the server.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
